
name: HTML to JPG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. 패키지 설치
      - name: Install dependencies
        run: npm install

      # 4. Playwright Chromium 설치
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 5. HTML을 JPG 4장으로 변환
      - name: Render JPG images
        run: npm run render

      # 6. 이미지 4장 생성 확인
      - name: Check generated images
        run: |
          for i in 1 2 3 4
          do
            FILE="output/page${i}.jpg"

            if [ ! -s "$FILE" ]; then
              echo "ERROR: $FILE 파일이 없거나 비어 있습니다."
              exit 1
            fi

            echo "OK: $FILE"
            ls -lh "$FILE"
          done

      # 7. 생성된 JPG를 GitHub에 저장
      - name: Commit generated JPG images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/page1.jpg output/page2.jpg output/page3.jpg output/page4.jpg

          if git diff --cached --quiet; then
            echo "변경된 JPG가 없습니다."
          else
            git commit -m "Generate economy Instagram images"
            git push
          fi

      # 8. 실행 결과 보관
      - name: Upload JPG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: economy-instagram-images
          path: output/page*.jpg
          if-no-files-found: error
